name: Build ziggy (native-linux-gnu proof of life)

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "zig/**"
      - ".github/workflows/build-ziggy.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build python3

      # The LLVM+Clang+LLD build is the expensive part (~2 hours) and never
      # changes between runs that only touch zig/ source — cache it so a fix
      # to our zig-specific code doesn't force a full LLVM rebuild every time.
      # Keyed on the llvm/clang/lld/cmake dirs' content, which come from the
      # zig-bootstrap pin and don't change unless we intentionally update it.
      - name: Cache LLVM/Clang/LLD build+install
        uses: actions/cache@v4
        with:
          path: |
            out/build-llvm-host
            out/host
          key: llvm-host-${{ hashFiles('llvm/**', 'clang/**', 'lld/**', 'cmake/**', 'zlib/**', 'zstd/**') }}

      - name: Build ziggy (full LLVM+Clang+LLD+Zig bootstrap)
        env:
          CMAKE_GENERATOR: Ninja
        run: ./build native-linux-gnu baseline

      - name: Rename output binary to ziggy
        run: |
          OUTDIR="out/zig-native-linux-gnu-baseline"
          ls -la "$OUTDIR"
          cp "$OUTDIR/bin/zig" "$OUTDIR/bin/ziggy"
          chmod +x "$OUTDIR/bin/ziggy"
          "$OUTDIR/bin/ziggy" version
          "$OUTDIR/bin/ziggy" nm --help | head -5
          "$OUTDIR/bin/ziggy" objdump --help | head -5

      - name: Upload ziggy artifact
        uses: actions/upload-artifact@v4
        with:
          name: ziggy-x86_64-linux-gnu
          path: out/zig-native-linux-gnu-baseline/
          retention-days: 30
